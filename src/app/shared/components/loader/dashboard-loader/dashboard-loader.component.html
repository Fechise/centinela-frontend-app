<!-- dashboard-loader.component.html -->
<div class="w-full max-w-6xl mx-auto flex flex-col justify-center items-center mb-6 mt-8 px-4 gap-y-3 animate-pulse">

  <!-- Title skeleton (border-l-4, alineado a la izquierda) -->
  <div class="border-l-4 border-gray-300 pl-4 mb-6 w-full text-left flex items-center h-10">
    <div class="h-6 bg-gray-200 rounded w-64"></div>
  </div>

  <div class="w-full flex flex-col gap-y-3">

    <!-- Fila: filtros (ancho de contenido) + resumen (flex-grow) -->
    <div class="flex flex-col md:flex-row mb-1 justify-between gap-1">
      <!-- Filtros -->
      <div class="border-2 border-gray-200 rounded-md mr-1 mb-1 w-full md:w-64">
        <div class="h-7 bg-gray-200 rounded-t-md w-full"></div>
        <div class="flex flex-col items-center gap-y-2 px-2 pb-2 pt-2">
          <div class="h-4 bg-gray-200 rounded w-32"></div>
          <div class="h-4 bg-gray-200 rounded w-24"></div>
          <div class="h-8 bg-gray-200 rounded w-full"></div>
        </div>
      </div>
      <!-- Resumen (crece) -->
      <div class="border-2 border-gray-200 rounded-md flex flex-col flex-grow mb-1">
        <div class="h-7 bg-gray-200 rounded-t-md w-3/4 m-1"></div>
        <div class="flex justify-around items-center px-2 pb-4 pt-2 gap-2">
          <div class="h-12 w-12 bg-gray-200 rounded-full"></div>
          <div class="h-12 w-12 bg-gray-200 rounded-full"></div>
          <div class="h-12 w-12 bg-gray-200 rounded-full"></div>
        </div>
      </div>
    </div>

    <!-- Gráfico de línea (ancho completo) -->
    <div class="w-full border-2 border-gray-200 rounded-md mb-2">
      <div class="h-7 bg-gray-200 rounded-t-md w-1/2 m-1"></div>
      <div class="w-full flex justify-center items-center p-2">
        <div class="h-[250px] w-full bg-gray-200 rounded-lg"></div>
      </div>
    </div>

    <!-- Gráfico de barras (ancho completo) -->
    <div class="w-full border-2 border-gray-200 rounded-md mb-2">
      <div class="h-7 bg-gray-200 rounded-t-md w-2/3 m-1"></div>
      <div class="flex flex-col justify-center items-center p-2">
        <div class="h-[300px] w-full bg-gray-200 rounded-lg"></div>
      </div>
    </div>

    <!-- Fila: tree-map + mapa de Ecuador -->
    <div class="flex flex-col md:flex-row gap-2">
      <div class="border-2 border-gray-200 rounded-md mb-1 w-full md:w-1/2">
        <div class="h-7 bg-gray-200 rounded-t-md w-3/4 m-1"></div>
        <div class="h-[400px] w-full bg-gray-200 rounded-lg"></div>
      </div>
      <div class="border-2 border-gray-200 rounded-md mb-1 w-full md:w-1/2">
        <div class="h-7 bg-gray-200 rounded-t-md w-3/4 m-1"></div>
        <div class="h-[400px] w-full bg-gray-200 rounded-lg"></div>
      </div>
    </div>

    <!-- Bloque "More Statistics" con íconos -->
    <div class="flex flex-col justify-center border-2 border-gray-200 rounded-2 mb-2">
      <div class="h-7 bg-gray-200 w-full"></div>
      <div class="flex justify-center gap-x-8 px-5 pb-2 pt-3">
        <div class="flex flex-col items-center justify-center gap-y-2">
          <div class="h-12 w-12 bg-gray-200 rounded-full"></div>
          <div class="h-3 bg-gray-200 rounded w-20"></div>
        </div>
        <div class="flex flex-col items-center justify-center gap-y-2">
          <div class="h-12 w-12 bg-gray-200 rounded-full"></div>
          <div class="h-3 bg-gray-200 rounded w-24"></div>
        </div>
      </div>
    </div>

  </div>
</div>
