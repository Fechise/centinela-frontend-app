<div class="flex flex-col md:flex-row justify-center gap-6 items-start mt-4 w-full px-4 xl:px-8">
  <app-filters-sidebar class="w-full md:w-72 flex-shrink-0" [isFirstLoad]="isFirstLoad" [isLoading]="isFiltering"
    [isDisabled]="noResults && selectedAffiliations.length === 0">
    <!-- Authors number -->
    <div class="py-2 px-4 font-semibold border-b border-gray-200 text-gray-700 bg-gray-50 text-sm tracking-wide">
      Number of authors
    </div>
    <div class="py-3 px-3 border-b-gray-400 border-b-2 flex flex-col gap-2 bg-white">
      <div class="flex justify-between gap-2 mb-1">
        <button type="button" 
          class="flex-1 py-1 px-2 text-xs font-semibold rounded border transition-colors"
          [ngClass]="authorsNumber === 50 ? 'bg-red-700 text-white border-red-700' : 'bg-gray-50 text-gray-700 border-gray-300 hover:bg-gray-100'"
          (click)="setAuthorsNumber(50)">50</button>
        <button type="button" 
          class="flex-1 py-1 px-2 text-xs font-semibold rounded border transition-colors"
          [ngClass]="authorsNumber === 100 ? 'bg-red-700 text-white border-red-700' : 'bg-gray-50 text-gray-700 border-gray-300 hover:bg-gray-100'"
          (click)="setAuthorsNumber(100)">100</button>
        <button type="button" 
          class="flex-1 py-1 px-2 text-xs font-semibold rounded border transition-colors"
          [ngClass]="authorsNumber === 200 ? 'bg-red-700 text-white border-red-700' : 'bg-gray-50 text-gray-700 border-gray-300 hover:bg-gray-100'"
          (click)="setAuthorsNumber(200)">200</button>
      </div>
      <label for="authorsRange" class="form-label text-xs text-gray-600 font-medium mt-1 mb-0">Authors: <span class="font-bold text-gray-900">{{authorsNumber}}</span></label>
      <input id="authorsRange" type="range" class="form-range w-full" min="10" max="200" step="10" [(ngModel)]="authorsNumber"
        (change)="onAuthorsNumberChange()">
    </div>

    <!-- Affiliations -->
    <div class="py-2 px-4 font-semibold border-b border-gray-200 text-gray-700 bg-gray-50 text-sm tracking-wide"
      *ngIf="affiliations && affiliations.length > 0">
      Affiliations
    </div>
    <div class="p-3 border-b border-gray-200 bg-white" *ngIf="affiliations && affiliations.length > 0">
      <div class="flex items-center gap-3 w-full bg-white border border-gray-300 rounded-lg px-3 py-2 focus-within:ring-2 focus-within:ring-red-500 focus-within:border-red-500 shadow-sm transition-all">
        <fa-icon [icon]="faMagnifyingGlass" class="text-red-700 text-sm flex-shrink-0"></fa-icon>
        <input type="text" [(ngModel)]="affiliationSearch" placeholder="Search affiliations..."
          class="w-full bg-transparent border-none outline-none text-sm text-gray-800 placeholder-gray-400 p-0 focus:ring-0">
      </div>
    </div>
    <div class="py-3 px-4 flex md:flex-col gap-3 max-h-96 overflow-y-auto bg-white"
      *ngIf="affiliations && affiliations.length > 0">
      <div class="flex gap-3 items-center hover:bg-gray-50 p-1 rounded transition-colors"
        *ngFor="let aff of filteredAffiliations">
        <input [id]="aff.scopus_id" type="checkbox" [checked]="selectedAffiliations.includes(aff.scopus_id)"
          (change)="onClickCheckbox($any($event))"
          class="form-checkbox h-4 w-4 text-red-600 rounded border-gray-300 focus:ring-red-500 cursor-pointer">
        <label [for]="aff.scopus_id"
          class="ml-2 text-sm text-gray-600 cursor-pointer flex-1 leading-tight">{{aff.name}}</label>
      </div>
      <div *ngIf="filteredAffiliations.length === 0" class="text-sm text-gray-400 italic p-1">No matches found</div>
    </div>
  </app-filters-sidebar>


  <div class="flex-1 w-full flex flex-col">
    <div
      class="flex flex-col justify-between w-full bg-white rounded-xl shadow-md border border-gray-200 overflow-hidden">
      <div *ngIf="!showGraph"
        class="w-full h-[600px] md:h-[800px] flex flex-col items-center justify-center gap-4 bg-white">
        <div class="w-12 h-12 border-4 border-gray-200 border-t-red-600 rounded-full animate-spin"></div>
        <span class="text-gray-500 text-sm">Loading authors graph…</span>
      </div>

      <ng-container *ngIf="showGraph && !noResults">
        <div class="flex flex-row justify-between items-center w-full p-4 bg-white border-b border-gray-200">
          <div class="flex items-center gap-6 text-gray-700">
            <div class="flex items-center gap-2"><span class="font-bold text-gray-900">Nodes:</span> <span
                class="bg-gray-100 px-3 py-1 rounded-full text-sm font-semibold">{{d3Nodes.length}}</span></div>
            <div class="flex items-center gap-2"><span class="font-bold text-gray-900">Relations:</span> <span
                class="bg-gray-100 px-3 py-1 rounded-full text-sm font-semibold">{{d3Links.length}}</span></div>
          </div>
          <div class="flex items-center gap-2" *ngIf="d3Nodes.length > 0;">
            <button type="button"
              class="bg-red-700 hover:bg-red-800 text-white py-2 px-4 rounded-lg shadow-sm flex items-center gap-2 transition-colors font-medium text-sm"
              (click)="onDownloadGraph()" [disabled]="selectingRegion">
              <fa-icon [icon]="faDownload"></fa-icon>
              Download all
            </button>
            <button type="button"
              class="border border-red-700 py-2 px-4 rounded-lg shadow-sm flex items-center gap-2 transition-colors font-medium text-sm"
              [ngClass]="selectingRegion ? 'bg-red-700 text-white' : 'text-red-700 hover:bg-red-50'"
              (click)="toggleRegionSelect()">
              <fa-icon [icon]="faVectorSquare"></fa-icon>
              {{ selectingRegion ? 'Cancel' : 'Select region' }}
            </button>
          </div>
        </div>
      </ng-container>
    </div>

    <!-- AQUÍ SE RESOLVIÓ EL CONFLICTO -->
    <ng-container *ngIf="showGraph && noResults">
      <app-no-results [isServerOnline]="true" title="No results found"></app-no-results>
    </ng-container>

    <div class="w-full max-w-full overflow-hidden mt-4 mat-elevation-z8" *ngIf="showGraph && !noResults">
      <div class="w-full h-[600px] md:h-[800px] overflow-hidden bg-white rounded relative" #downloadEl>

        <!-- Zoom Controls Overlay (z-30 para quedar sobre el overlay de seleccion y seguir clickeables) -->
        <div class="absolute top-4 right-4 z-30 flex flex-col gap-2">
          <button (click)="zoomIn()"
            class="bg-white border shadow-md w-10 h-10 rounded-full flex items-center justify-center hover:bg-gray-100 text-2xl font-bold text-gray-700 select-none"
            title="Zoom in">+</button>
          <button (click)="zoomOut()"
            class="bg-white border shadow-md w-10 h-10 rounded-full flex items-center justify-center hover:bg-gray-100 text-2xl font-bold text-gray-700 select-none"
            title="Zoom out">-</button>
          <button (click)="fitAll()"
            class="bg-white border shadow-md w-10 h-10 rounded-full flex items-center justify-center hover:bg-gray-100 text-gray-700 mt-2"
            title="Fit to view">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9"></circle>
              <line x1="12" y1="8" x2="12" y2="16"></line>
              <line x1="8" y1="12" x2="16" y2="12"></line>
            </svg>
          </button>
        </div>

        <!-- Overlay de seleccion de zona: arrastrar para recortar y exportar solo esa parte -->
        <div *ngIf="selectingRegion" class="absolute inset-0 z-20 cursor-crosshair select-none"
          (mousedown)="onRegionMouseDown($event)" (mousemove)="onRegionMouseMove($event)" (mouseup)="onRegionMouseUp()"
          (mouseleave)="onRegionMouseUp()">
          <div *ngIf="!regionRect"
            class="absolute top-3 left-1/2 -translate-x-1/2 text-white text-xs px-3 py-1 rounded-full whitespace-nowrap"
            style="background: rgba(0,0,0,0.7)">
            Drag to select the region to download
          </div>
          <div *ngIf="regionRect" class="absolute border-2 border-red-600 pointer-events-none"
            [style.left.px]="regionRect.x" [style.top.px]="regionRect.y" [style.width.px]="regionRect.w"
            [style.height.px]="regionRect.h" [style.background]="'rgba(220,38,38,0.12)'"></div>
        </div>

        <graph [nodes]="d3Nodes" [links]="d3Links" [forces]="forces"></graph>
      </div>
    </div>
  </div>
</div>
